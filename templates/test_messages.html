<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Message History</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: #1a1a2e;
            color: #e0e0e0;
        }
        h1 { color: #00d4ff; border-bottom: 2px solid #00d4ff; padding-bottom: 8px; }
        .count { color: #888; font-size: 14px; margin-bottom: 20px; }
        .msg {
            background: rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 16px;
            margin: 10px 0;
            border-left: 3px solid #667eea;
        }
        .msg-text { font-size: 16px; margin-bottom: 8px; line-height: 1.4; }
        .msg-meta { font-size: 12px; color: #888; display: flex; gap: 16px; }
        .msg-sender { color: #667eea; }
        .msg-time { color: #666; }
        .empty { text-align: center; padding: 40px; color: #555; }
        .clear-btn {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            float: right;
        }
        .clear-btn:hover { background: #dc2626; }
        .clear-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .back-link { color: #00d4ff; text-decoration: none; display: inline-block; margin-top: 20px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <h1>💬 Message History <button class="clear-btn" id="clear-btn" onclick="clearHistory()">🗑 Clear History</button></h1>
    <div class="count" id="count"></div>
    <div id="messages">Loading...</div>
    <br>
    <a href="/admin" class="back-link">← Back to Admin</a>

    <script>
        function escapeHtml(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#x27;'
            })[c]);
        }

        async function load() {
            try {
                const res = await fetch('/api/message/history');
                const data = await res.json();
                document.getElementById('count').textContent = `${data.total} message${data.total !== 1 ? 's' : ''} total`;

                if (data.messages.length === 0) {
                    document.getElementById('messages').innerHTML = '<div class="empty">No messages yet</div>';
                    return;
                }

                let html = '';
                for (const m of data.messages) {
                    const dt = new Date(m.timestamp);
                    const timeStr = dt.toLocaleString('en-US', {
                        month: 'short', day: 'numeric',
                        hour: 'numeric', minute: '2-digit', hour12: true
                    });
                    const sender = escapeHtml(m.sender);
                    // m.text is HTML-escaped server-side when the message is submitted
                    html += `<div class="msg">
                        <div class="msg-text">${m.text}</div>
                        <div class="msg-meta">
                            <span class="msg-sender">${sender}</span>
                            <span class="msg-time">${timeStr}</span>
                        </div>
                    </div>`;
                }
                document.getElementById('messages').innerHTML = html;
            } catch (e) {
                document.getElementById('messages').innerHTML = '<div class="empty">Error loading history</div>';
            }
        }
        load();

        async function clearHistory() {
            if (!confirm('Clear all message history?')) return;
            const btn = document.getElementById('clear-btn');
            btn.disabled = true;
            try {
                const res = await fetch('/api/message/history', { method: 'DELETE' });
                const data = await res.json();
                if (data.ok) load();
            } catch (e) {
                alert('Failed to clear history');
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
