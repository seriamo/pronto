<!DOCTYPE html>
<html>
<head>
    <title>Background Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1400px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        h1 {
            color: #333;
            border-bottom: 3px solid #0078d4;
            padding-bottom: 10px;
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }
        .bg-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .bg-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
        }
        .bg-preview {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .bg-info {
            padding: 15px;
        }
        .bg-name {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        .bg-dates {
            font-size: 14px;
            color: #666;
        }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #0078d4;
            text-decoration: none;
            font-size: 16px;
        }
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>🎨 Seasonal &amp; Holiday Backgrounds</h1>
    <p>All backgrounds used throughout the year based on dates and holidays.</p>
    
    <div class="gallery">
        {% for filename, name, dates in backgrounds %}
        <div class="bg-card">
            <div class="bg-preview" style="background-image: url('/static/{{ filename }}');"></div>
            <div class="bg-info">
                <div class="bg-name">{{ name }}</div>
                <div class="bg-dates">{{ dates }}</div>
            </div>
        </div>
        {% endfor %}
    </div>
    
    <a href="/admin" class="back-link">← Back to Admin</a>
</body>
</html>
